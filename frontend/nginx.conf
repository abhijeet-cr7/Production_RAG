# Serves the built UI and forwards API calls to the `api` container, so the
# browser only ever talks to one origin (no CORS, one port to expose).
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Uploads (PDF/DOCX) and slow LLM answers need generous limits.
    client_max_body_size 30m;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;

    location ~ ^/(query|ingest|health|admin)(/|$) {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri /index.html;
    }
}
