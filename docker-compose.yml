# Production RAG — full local stack.
#
#   ./scripts/docker-up.sh            check ports, then build and start everything
#   docker compose up -d --build      the same, without the port check
#   docker compose --profile kafka up -d   also start Kafka + ZooKeeper (async ingestion)
#
# Every host port is configurable (see .env.example); scripts/docker-up.sh picks
# free ones automatically when a default is already taken on your machine.
name: production-rag

services:
  # ── Vector database ─────────────────────────────────────────────────────────
  qdrant:
    image: qdrant/qdrant:v1.9.2
    ports:
      - "${QDRANT_PORT:-6333}:6333"
      - "${QDRANT_GRPC_PORT:-6334}:6334"
    volumes:
      - qdrant_storage:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/127.0.0.1/6333'"]
      interval: 5s
      timeout: 3s
      retries: 20

  # ── Embedding cache ─────────────────────────────────────────────────────────
  redis:
    image: redis:7.2-alpine
    command: redis-server --save 60 1 --loglevel warning
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  # ── API ─────────────────────────────────────────────────────────────────────
  api:
    build: .
    image: production-rag-api
    depends_on:
      qdrant:
        condition: service_healthy
      redis:
        condition: service_healthy
    # Your keys and auth settings live in .env (never committed). Values under
    # `environment` below win over .env, so a localhost URL there cannot break the stack.
    env_file:
      - path: .env
        required: false
      # Written by `scripts/docker-up.sh --dev-auth`; overrides .env when present.
      - path: .env.dev-auth
        required: false
    environment:
      QDRANT_URL: http://qdrant:6333
      REDIS_URL: redis://redis:6379/0
      AUDIT_LOG_PATH: /var/log/rag/audit.jsonl
    ports:
      - "${API_PORT:-8000}:8000"
    volumes:
      - audit_logs:/var/log/rag
      - hf_cache:/home/app/.cache/huggingface
      # Edit tenant policies without rebuilding the image; restart `api` to reload.
      - ./config:/app/config:ro
    restart: unless-stopped

  # ── Web UI (nginx serves the build and proxies API calls to `api`) ──────────
  frontend:
    build: ./frontend
    image: production-rag-ui
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${FRONTEND_PORT:-8080}:80"
    restart: unless-stopped

  # ── Optional: asynchronous ingestion (profile "kafka") ──────────────────────
  zookeeper:
    profiles: ["kafka"]
    image: confluentinc/cp-zookeeper:7.6.1
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "${ZOOKEEPER_PORT:-2181}:2181"

  kafka:
    profiles: ["kafka"]
    image: confluentinc/cp-kafka:7.6.1
    depends_on:
      - zookeeper
    ports:
      - "${KAFKA_PORT:-9092}:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      # PLAINTEXT_HOST is what you reach from your machine; PLAINTEXT is for containers.
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:29092,PLAINTEXT_HOST://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:${KAFKA_PORT:-9092}
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"

volumes:
  qdrant_storage:
  audit_logs:
  hf_cache:
